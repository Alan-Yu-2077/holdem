<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-V7lDfGMg5tBFQileQfkb6ijQyPIEzNez7GAmWKdowqg='; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss:; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07080a">
  <title>德州扑克 · 好友房</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5d41'/%3E%3Cpath d='M32 10C36 22 54 28 54 40c0 10-12 13-19 5 1 6 3 9 8 11H21c5-2 7-5 8-11-7 8-19 5-19-5 0-12 18-18 22-30z' fill='%23f3e3b3'/%3E%3C/svg%3E">

  <!-- 一次性并行拉取所有模块，避免一层层串行等待 -->
  <link rel="modulepreload" href="vendor/three/build/three.module.min.js">
  <link rel="modulepreload" href="vendor/three/examples/jsm/environments/RoomEnvironment.js">
  <link rel="modulepreload" href="vendor/three/examples/jsm/utils/BufferGeometryUtils.js">
  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/scene.js">
  <link rel="modulepreload" href="js/hud.js">
  <link rel="modulepreload" href="js/fx.js">
  <link rel="modulepreload" href="js/net.js">
  <link rel="modulepreload" href="js/mental.js">
  <link rel="modulepreload" href="js/p2p/signal.js">
  <link rel="modulepreload" href="js/p2p/host.js">
  <link rel="modulepreload" href="js/p2p/auth.js">
  <link rel="modulepreload" href="js/p2p/ice.js">
  <link rel="modulepreload" href="shared/engine/tourney.js">
  <link rel="modulepreload" href="shared/mp/protocol.js">
  <link rel="modulepreload" href="shared/mp/ec.js">
  <link rel="modulepreload" href="vendor/trystero/nostr/index.mjs">
  <link rel="modulepreload" href="vendor/trystero/torrent/index.mjs">
  <link rel="modulepreload" href="vendor/trystero/core/index.mjs">
  <link rel="modulepreload" href="vendor/noble/index.js">
  <script src="js/boot.js"></script>
</head>
<body class="booting">
<div id="app">
  <canvas id="stage"></canvas>
  <div id="vignette"></div>

  <!-- ───────────── 主页：创建 / 加入 ───────────── -->
  <section id="home" class="screen">
    <div class="home-card">
      <header class="masthead">
        <div class="meta"><span>私人牌局</span><span class="mono">P2P · NO SERVER</span></div>
        <h1><span class="title-en">Hold’em</span><span class="title-zh">德州扑克</span></h1>
        <p class="lede">一张只属于朋友们的牌桌。浏览器之间直接联机，发牌全程加密，谁也看不到别人的底牌。</p>
      </header>

      <label class="row">
        <span class="row-label">昵称</span>
        <input id="nick" type="text" maxlength="12" placeholder="给自己起个名字" autocomplete="off">
      </label>

      <div class="tabs" role="tablist">
        <button data-tab="create" class="on" role="tab">常规局</button>
        <button data-tab="tourney" role="tab">锦标赛</button>
        <button data-tab="join" role="tab">凭链接入座</button>
      </div>

      <div id="tab-create" class="tab-body">
        <div class="row"><span class="row-label" id="lbl-chips">初始筹码</span><div class="seg" id="opt-chips"></div></div>
        <div class="row" id="row-blinds"><span class="row-label">盲注</span><div class="seg" id="opt-blinds"></div></div>
        <div class="row" id="row-minutes" hidden><span class="row-label">比赛时长</span><div class="seg" id="opt-minutes"></div></div>
        <div class="row"><span class="row-label">座位</span><div class="seg" id="opt-seats"></div></div>
        <div class="row"><span class="row-label">思考时间</span><div class="seg" id="opt-time"></div></div>
        <p class="brief" id="tourney-brief" hidden></p>
        <button class="btn primary big" id="btn-create"><span id="create-label">开桌</span><i class="arrow" aria-hidden="true">→</i></button>
      </div>

      <div id="tab-join" class="tab-body" hidden>
        <label class="row stacked">
          <span class="row-label">邀请链接</span>
          <input id="invite-input" type="text" placeholder="粘贴好友发来的邀请链接" autocomplete="off" spellcheck="false">
        </label>
        <button class="btn primary big" id="btn-join"><span>入座</span><i class="arrow" aria-hidden="true">→</i></button>
      </div>

      <footer class="colophon">
        <p class="home-note">无需下载 · 浏览器直连 · 心理扑克加密发牌</p>
        <p class="boot-note"><i class="spinner"></i><span class="boot-loading">正在加载牌桌…</span><span class="boot-failed">加载失败，请检查网络后刷新</span></p>
      </footer>
    </div>
  </section>

  <!-- ───────────── 牌桌 HUD ───────────── -->
  <section id="table" class="screen" hidden>
    <header id="topbar">
      <div class="room-info">
        <button class="room-code" id="btn-code" title="复制邀请链接">
          <span class="label">牌桌</span><b id="room-code">------</b>
        </button>
        <span class="chip-tag" id="room-blinds"></span>
        <span class="chip-tag clock" id="room-clock" hidden></span>
        <span class="chip-tag subtle" id="room-hand"></span>
        <span class="chip-tag warn" id="room-status" hidden></span>
      </div>
      <nav class="tools">
        <button class="icon-btn" id="btn-invite" title="邀请好友"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg></button>
        <button class="icon-btn" id="btn-score" title="积分榜"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></button>
        <button class="icon-btn" id="btn-secure" title="牌局安全"><svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path class="tick" d="m9.2 15.6 2 2 3.6-3.8"/></svg></button>
        <button class="icon-btn" id="btn-cover" title="盖牌模式"><svg viewBox="0 0 24 24"><path class="open" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle class="open" cx="12" cy="12" r="3"/><path class="shut" d="M3 9.5c2.3 2.6 5.4 4 9 4s6.7-1.4 9-4M5.6 12.2 4 14.6m6.2-1.2-.5 2.8m4.6-2.8.5 2.8m3.6-4.2 1.6 2.4"/></svg></button>
        <button class="icon-btn" id="btn-sound" title="音效"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="m16 9 5 6m0-6-5 6"/></svg></button>
        <button class="icon-btn" id="btn-settings" title="房间设置" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="icon-btn" id="btn-leave" title="离开房间"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      </nav>
    </header>

    <div id="plates"></div>
    <div id="labels"></div>

    <div id="waiting" class="panel" hidden>
      <div class="waiting-title" id="waiting-title">牌桌已开 · 等待入座</div>
      <div class="waiting-code" id="waiting-code">------</div>
      <div class="invite-row">
        <input id="invite-link" readonly>
        <button class="btn" id="btn-copy">复制链接</button>
      </div>
      <div class="waiting-tourney" id="waiting-tourney" hidden>
        <div class="wt-facts" id="wt-facts"></div>
        <div class="wt-pay" id="wt-pay"></div>
      </div>
      <div class="waiting-hint" id="waiting-hint"></div>
      <div class="waiting-actions" id="waiting-actions">
        <button class="btn" id="btn-addbot">添加机器人</button>
        <button class="btn primary" id="btn-start">开始游戏</button>
      </div>
    </div>

    <div id="banner" aria-live="polite"></div>
    <div id="hand-hint" hidden></div>
    <div id="crypto-status" hidden></div>
    <button id="peek-btn" type="button" hidden title="按住查看底牌（也可以按住 V 键）">按住看牌</button>

    <div id="notice" class="panel" hidden>
      <span id="notice-text"></span>
      <button class="btn primary" id="notice-btn"></button>
    </div>

    <div id="feed">
      <div id="feed-list"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="120" placeholder="说点什么…  回车发送">
      </form>
    </div>

    <div id="actions" class="panel">
      <div class="act-head"><span class="act-title">轮到你了</span><span class="act-time" id="turn-left"></span></div>
      <div class="turn-bar"><i id="turn-bar-fill"></i></div>
      <div class="raise-box" id="raise-box">
        <div class="presets" id="presets"></div>
        <div class="raise-row">
          <button class="step" id="raise-minus" aria-label="减少">−</button>
          <input id="raise-range" type="range">
          <button class="step" id="raise-plus" aria-label="增加">＋</button>
          <input id="raise-input" type="text" inputmode="numeric">
        </div>
      </div>
      <div class="act-row">
        <button class="act fold" id="act-fold"><b>弃牌</b><kbd>F</kbd></button>
        <button class="act call" id="act-call"><b id="act-call-label">过牌</b><kbd>C</kbd></button>
        <button class="act raise" id="act-raise"><b id="act-raise-label">加注</b><kbd>R</kbd></button>
      </div>
    </div>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="modal" hidden><div class="modal-card panel" id="modal-card"></div></div>
  <div id="toasts"></div>
  <div id="offline" hidden><div class="spinner"></div><div class="offline-msg"><span id="offline-text">连接已断开，正在重新连接…</span><small id="offline-detail"></small></div></div>
</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
